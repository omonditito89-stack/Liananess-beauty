<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Liananess – Manage products</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--wine:#6b1f3a;--gold:#c9a24b;--cream:#fbf6ec;--ink:#2b1620}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 Jost,system-ui,sans-serif;background:var(--cream);color:var(--ink);padding:20px}
.w{max-width:720px;margin:0 auto}
h1,h2{font-family:'Playfair Display',serif;color:var(--wine)}
h1{font-size:1.8rem;margin-bottom:4px}h2{font-size:1.25rem;margin-bottom:10px}
.box{background:#fff;border:1px solid #efe4d3;border-radius:16px;padding:16px;margin:16px 0}
label{display:block;font-size:.85rem;color:#6a5a4a;margin:8px 0 2px}
input,select{width:100%;padding:10px 12px;border:1.5px solid #d9c9b4;border-radius:10px;font:inherit;background:#fff}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.btn{background:var(--wine);color:#fff;border:0;border-radius:999px;padding:11px 22px;font:600 1rem Jost;cursor:pointer;margin-top:12px}
.btn.s{padding:8px 16px;margin:0;font-size:.9rem}
.btn[disabled]{opacity:.5}
.item{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #f0e6d8}
.item img,.item .ph{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#f7dfe5}
.item .f{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;grid-column:1/-1;align-items:end}
.msg{min-height:1.4em;font-size:.92rem;margin-top:8px}
.ok{color:#1f7a4a}.err{color:#b3261e}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
a.link{color:var(--wine);font-size:.9rem}
@media(max-width:520px){.g{grid-template-columns:1fr}.item .f{grid-template-columns:1fr 1fr}.item .f button{grid-column:1/-1}}
</style>
</head>
<body>
<div class="w">
 <div class="top"><div><h1>Manage products</h1><p>Add items and update prices. Changes show on the shop straight away.</p></div><a class="link" href="index.html">View shop</a></div>

 <div class="box" id="login">
  <h2>Enter your PIN</h2>
  <input id="pin" type="password" inputmode="text" autocomplete="current-password" placeholder="PIN">
  <button class="btn" id="go">Unlock</button><div class="msg" id="lmsg"></div>
 </div>

 <div id="app" hidden>
  <div class="box">
   <h2>Add a new item</h2>
   <label for="n">Name</label><input id="n" placeholder="e.g. Gold Hoop Earrings">
   <div class="g">
    <div><label for="c">Category</label><input id="c" list="cl" placeholder="Earrings"><datalist id="cl"></datalist></div>
    <div><label for="p">Price (KSh)</label><input id="p" type="number" inputmode="numeric" min="0" placeholder="800"></div>
   </div>
   <label for="im">Photo link (optional)</label><input id="im" placeholder="img/my-photo.jpg or https://...">
   <div class="g">
    <div><label for="av">Availability</label><select id="av"><option value="yes">In stock</option><option value="no">Sold out</option></select></div>
    <div><label for="bd">Tag (optional)</label><input id="bd" placeholder="New, Best seller"></div>
   </div>
   <button class="btn" id="add">Add item</button><div class="msg" id="amsg"></div>
  </div>
  <div class="box"><h2>Your products</h2><div id="list">Loading...</div></div>
 </div>
</div>

<script>
const APPS_SCRIPT_URL = ""; // paste your Apps Script Web app URL here
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let pin=sessionStorage.getItem("lpin")||"",items=[];

async function call(body){
  const r=await fetch(APPS_SCRIPT_URL,{method:"POST",body:JSON.stringify({pin,...body})});
  return r.json();
}
async function load(){
  const r=await fetch(APPS_SCRIPT_URL+"?t="+Date.now());items=(await r.json()).products||[];
  $("cl").innerHTML=[...new Set(items.map(i=>i.category).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("");
  $("list").innerHTML=items.length?items.map((p,i)=>`<div class="item">
   ${p.image?`<img src="${esc(p.image)}" alt="">`:`<div class="ph"></div>`}
   <div><b>${esc(p.name)}</b><br><small>${esc(p.category)}</small></div>
   <div class="f"><div><label>Price (KSh)</label><input type="number" inputmode="numeric" min="0" id="pr${i}" value="${esc(p.price)}"></div>
   <div><label>Availability</label><select id="av${i}"><option value="yes">In stock</option><option value="no" ${/^(no|n|sold|out)/i.test(p.available)?"selected":""}>Sold out</option></select></div>
   <button class="btn s" data-i="${i}">Save</button></div><div class="msg" id="m${i}" style="grid-column:1/-1;margin:0"></div></div>`).join(""):"No products yet. Add your first item above.";
  $("av"+0)&&0;
}
async function unlock(){
  if(!APPS_SCRIPT_URL){$("lmsg").innerHTML='<span class="err">Set APPS_SCRIPT_URL in admin.html first.</span>';return}
  pin=$("pin").value||pin;$("lmsg").textContent="Checking...";
  try{const r=await call({action:"check"});
   if(!r.ok)throw new Error(r.error);
   sessionStorage.setItem("lpin",pin);$("login").hidden=true;$("app").hidden=false;load();
  }catch(e){$("lmsg").innerHTML=`<span class="err">${esc(e.message==="Wrong PIN"?"That PIN is not right.":"Could not connect. Check the Apps Script link.")}</span>`}
}
$("go").onclick=unlock;$("pin").onkeydown=e=>{if(e.key==="Enter")unlock()};
if(pin&&APPS_SCRIPT_URL){$("pin").value=pin;unlock()}

$("add").onclick=async()=>{
  const item={name:$("n").value.trim(),category:$("c").value.trim(),price:$("p").value,image:$("im").value.trim(),available:$("av").value,badge:$("bd").value.trim()};
  if(!item.name){$("amsg").innerHTML='<span class="err">Enter a name.</span>';return}
  $("add").disabled=true;$("amsg").textContent="Saving...";
  try{const r=await call({action:"add",item});if(!r.ok)throw new Error(r.error);
   $("amsg").innerHTML='<span class="ok">Added. It is now on the shop.</span>';["n","c","p","im","bd"].forEach(k=>$(k).value="");await load();
  }catch(e){$("amsg").innerHTML=`<span class="err">${esc(e.message)}</span>`}
  $("add").disabled=false;
};
$("list").onclick=async e=>{
  const b=e.target.closest("button[data-i]");if(!b)return;
  const i=b.dataset.i,p=items[i],m=$("m"+i);b.disabled=true;m.textContent="Saving...";
  try{const r=await call({action:"update",row:p.row,item:{oldName:p.name,price:$("pr"+i).value,available:$("av"+i).value}});
   if(!r.ok)throw new Error(r.error);p.price=$("pr"+i).value;m.innerHTML='<span class="ok">Saved</span>';
  }catch(err){m.innerHTML=`<span class="err">${esc(err.message)}</span>`}
  b.disabled=false;
};
</script>
</body>
</html>
